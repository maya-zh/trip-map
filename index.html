<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>追秋 · 大兴安岭十日之旅</title>
<meta name="description" content="台州出发，穿越呼伦贝尔大草原与大兴安岭的十日自驾行程地图">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#86868b;--accent:#0071e3;--red:#ff3b30;--org:#ff9500;--grn:#34c759;--blu:#007aff;--pur:#af52de;--sep:rgba(60,60,67,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.47}
#map{width:100%;height:42vh;min-height:300px;position:sticky;top:0;z-index:100}
.tabs{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);position:sticky;top:42vh;z-index:150;border-bottom:.5px solid var(--sep);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 16px;border-radius:980px;border:none;background:#f2f2f7;color:var(--sub);font-size:14px;font-weight:500;cursor:pointer;transition:all .25s;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff}
.content{max-width:680px;margin:0 auto;padding:16px 16px 24px}
.hero{text-align:center;padding:20px}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.hero p{font-size:15px;color:var(--sub);margin-top:4px}
.section-head{font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;padding:16px 0 6px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.info-card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.info-card .lab{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;margin-bottom:4px}
.info-card .val{font-size:14px;font-weight:600;line-height:1.4}
.day-head{padding:12px 0 8px}
.day-head h2{font-size:20px;font-weight:700}
.day-head p{font-size:14px;color:var(--sub)}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer}
.card .time{font-size:11px;font-weight:600;color:var(--sub)}
.card .name{font-size:16px;font-weight:600;margin:2px 0}
.card .desc{font-size:13px;color:var(--sub);line-height:1.45}
.card .budget{display:inline-block;margin-top:4px;padding:2px 8px;background:#f2f2f7;border-radius:6px;font-size:11px;color:var(--sub);font-weight:500}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:5px;top:14px;bottom:14px;width:1.5px;background:var(--sep)}
.tl-item{position:relative;margin-bottom:8px}
.tl-dot{position:absolute;left:-19px;top:16px;width:10px;height:10px;border-radius:50%;z-index:1;background:#fff;border:2px solid var(--blu)}
.pay-summary{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;font-size:13px;line-height:1.7}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.links{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:3px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;text-decoration:none!important}
.btn.nav{background:var(--accent);color:#fff}
.btn.xhs{background:#ff2442;color:#fff}
.btn:active{filter:brightness(.9)}
.badge{display:inline-flex;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;background:rgba(0,122,255,.1);color:var(--blu)}
.leaflet-popup-content-wrapper{border-radius:10px!important;box-shadow:0 4px 14px rgba(0,0,0,.12)!important}
.leaflet-popup-content{font-size:13px!important;margin:10px 12px!important;line-height:1.5}
.leaflet-popup-content a{color:var(--accent)!important}
.leaflet-control-zoom a{width:32px!important;height:32px!important;line-height:30px!important;border-radius:8px!important;background:rgba(255,255,255,.88)!important;border:.5px solid var(--sep)!important;font-size:14px!important}
</style>
</head>
<body>
<div id="map"></div>
<div id="tabs" class="tabs"></div>
<div id="content" class="content"></div>
<script>
const DAYS=[
{id:0,label:'总览',color:'#0071e3',locations:[]},
{id:1,label:'DAY1',date:'9.26 周六',title:'台州→海拉尔',color:'#ff9500',locations:[
  {name:'台州',lat:28.656,lng:121.42,type:'transport',time:'全天',desc:'出发城市'},
  {name:'海拉尔东山机场',lat:49.205,lng:119.825,type:'transport',time:'抵达',desc:'呼伦贝尔首府'}
]},
{id:2,label:'DAY2',date:'9.27 周日',title:'海拉尔→根河',color:'#34c759',locations:[
  {name:'海拉尔',lat:49.205,lng:119.825,type:'hotel',time:'出发',desc:'酒店早餐后出发'},
  {name:'莫尔格勒河',lat:50.0592,lng:121.0075,type:'spot',time:'10:00',desc:'天下第一曲水 5A景区 观光车40元/人',budget:'¥80'},
  {name:'额尔古纳湿地景区',lat:50.2236,lng:120.1709,type:'spot',time:'—',desc:'亚洲第一湿地 门票65+观光车15=80元/人 【与额尔古纳国家湿地公园二选一】',budget:'¥160'},
  {name:'额尔古纳国家湿地公园',lat:50.3,lng:120.25,type:'spot',time:'—',desc:'门票60+观光车20=80元/人 【与额尔古纳湿地景区二选一】',budget:'¥160'},
  {name:'根河',lat:50.7847,lng:121.4771,type:'hotel',time:'20:00',desc:'住宿根河'}
]},
{id:3,label:'DAY3',date:'9.28 周一',title:'根河→满归',color:'#af52de',locations:[
  {name:'根河',lat:50.7847,lng:121.4771,type:'hotel',time:'出发',desc:'清晨出发'},
  {name:'敖鲁古雅驯鹿部落',lat:50.9167,lng:121.4833,type:'spot',time:'09:00',desc:'中国唯一饲养驯鹿的鄂温克族 门票118元/人',budget:'¥276'},
  {name:'根满线沿途',lat:51.35,lng:121.75,type:'transport',time:'13:00',desc:'200km/3.5h 沿途风景绝美'},
  {name:'伊克萨玛森林公园(备选)',lat:52.0667,lng:121.8667,type:'spot',time:'16:00',desc:'60km/1h 从满归往返',budget:'免费'},
  {name:'满归',lat:51.9083,lng:122.0833,type:'hotel',time:'18:00',desc:'住宿满归 满归加油站加满油！'}
]},
{id:4,label:'DAY4',date:'9.29 周二',title:'满归→莫尔道嘎',color:'#ff2d55',locations:[
  {name:'满归',lat:51.9083,lng:122.0833,type:'hotel',time:'出发',desc:'加满油出发'},
  {name:'白鹿岛',lat:52.35,lng:122.2,type:'spot',time:'10:00',desc:'140km/3h 中俄界河岛上'},
  {name:'莫尔道嘎国家森林公园',lat:51.2667,lng:120.4167,type:'spot',time:'15:00',desc:'90km/1.5h 中国最大森林公园 小火车100元/人',budget:'¥200'},
  {name:'莫尔道嘎',lat:51.2667,lng:120.4167,type:'hotel',time:'19:00',desc:'住宿莫尔道嘎镇'}
]},
{id:5,label:'DAY5',date:'9.30 周三',title:'莫尔道嘎→室韦',color:'#5ac8fa',locations:[
  {name:'莫尔道嘎',lat:51.2667,lng:120.4167,type:'hotel',time:'出发',desc:'清晨出发'},
  {name:'白桦林景区',lat:51.15,lng:120.05,type:'spot',time:'10:00',desc:'100km/2h 纯白桦林'},
  {name:'老鹰嘴',lat:51.2,lng:119.95,type:'spot',time:'12:00',desc:'天然巨石景观 俯瞰额尔古纳河'},
  {name:'室韦',lat:51.344,lng:119.8998,type:'hotel',time:'17:00',desc:'中国十大最美乡村'}
]},
{id:6,label:'DAY6',date:'10.1 周四',title:'室韦→黑山头',color:'#ff6b6b',locations:[
  {name:'室韦',lat:51.344,lng:119.8998,type:'hotel',time:'出发',desc:'清晨出发'},
  {name:'最美边防卡线',lat:51.0,lng:119.5,type:'spot',time:'10:00',desc:'130km/2.5h 中俄边境风景线'},
  {name:'五卡五彩湿地',lat:50.6,lng:119.45,type:'spot',time:'13:00',desc:'秋季五彩斑斓的湿地'},
  {name:'黑山头日落',lat:50.3625,lng:119.4063,type:'spot',time:'17:00',desc:'40km/40min 中国最美日落之一'},
  {name:'黑山头',lat:50.3625,lng:119.4063,type:'hotel',time:'19:00',desc:'住宿黑山头'}
]},
{id:7,label:'DAY7',date:'10.2 周五',title:'黑山头→海拉尔',color:'#4cd964',locations:[
  {name:'黑山头',lat:50.3625,lng:119.4063,type:'hotel',time:'出发',desc:'清晨出发'},
  {name:'哈克崖山',lat:49.3,lng:119.65,type:'spot',time:'10:00',desc:'200km/3h 草原上的神秘岩山'},
  {name:'海拉尔',lat:49.205,lng:119.825,type:'hotel',time:'18:00',desc:'60km/1h 返回海拉尔'}
]},
{id:8,label:'DAY8',date:'10.3 周六',title:'海拉尔→阿尔山',color:'#5856d6',locations:[
  {name:'海拉尔',lat:49.205,lng:119.825,type:'hotel',time:'出发',desc:'一早出发'},
  {name:'阿尔山森林公园',lat:47.1,lng:119.9333,type:'spot',time:'12:00',desc:'330km/4.5h 亚洲最大火山熔岩地貌 门票180+大巴105=285元/人',budget:'¥870'},
  {name:'阿尔山',lat:47.1,lng:119.9333,type:'hotel',time:'17:00',desc:'住宿阿尔山市'}
]},
{id:9,label:'DAY9',date:'10.4 周日',title:'阿尔山→海拉尔',color:'#ff9500',locations:[
  {name:'阿尔山',lat:47.1,lng:119.9333,type:'hotel',time:'出发',desc:'一早出发'},
  {name:'阿尔山森林公园(二游)',lat:47.1,lng:119.9333,type:'spot',time:'09:00',desc:'330km/4.5h 返程顺路'},
  {name:'海拉尔',lat:49.205,lng:119.825,type:'hotel',time:'18:00',desc:'住宿海拉尔'}
]},
{id:10,label:'DAY10',date:'10.5 周一',title:'海拉尔→台州',color:'#8e8e93',locations:[
  {name:'海拉尔',lat:49.205,lng:119.825,type:'transport',time:'全天',desc:'搭乘航班返回台州'},
  {name:'台州',lat:28.656,lng:121.42,type:'transport',time:'抵达',desc:'平安到家'}
]}
];
const map=L.map('map',{center:[49.5,120.2],zoom:6,zoomControl:false,attributionControl:true});
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap © CartoDB'}).addTo(map);
const emojis={food:'🍽️',spot:'📍',hotel:'🏨',transport:'🚗',drink:'🍺'};
let markers=[],polylines=[];
function clearMap(){markers.forEach(m=>map.removeLayer(m));polylines.forEach(p=>map.removeLayer(p));markers=[];polylines=[];}
function amapNavUrl(lat,lng){return 'https://uri.amap.com/navigation?to='+lng+','+lat+'&mode=car&src=trip-map&coordinate=gcj02';}
function amapWebUrl(name,lat,lng){return 'https://uri.amap.com/marker?position='+lng+','+lat+'&name='+encodeURIComponent(name)+'&src=trip-map&coordinate=gcj02';}
function showDay(idx){
  clearMap();
  if(idx===0){
    const pts=[];
    DAYS.forEach(d=>d.locations.forEach(l=>{if(l.lat)pts.push([l.lat,l.lng]);}));
    if(pts.length)map.fitBounds(pts,{padding:[30,30]});
    DAYS.slice(1).forEach(d=>{
      d.locations.forEach(l=>{
        if(!l.lat)return;
        const m=L.circleMarker([l.lat,l.lng],{radius:4,fillColor:d.color,color:'#fff',weight:1.5,fillOpacity:.9}).addTo(map).bindPopup('<b>'+l.name+'</b><br>'+d.label+'<br><a href="'+amapNavUrl(l.lat,l.lng)+'" target="_blank">🧭 导航</a>');
        markers.push(m);
      });
    });
    return;
  }
  const day=DAYS.find(d=>d.id===idx);if(!day)return;
  const coords=[];
  day.locations.forEach(l=>{
    if(!l.lat)return;
    const ic=L.divIcon({className:'',html:'<div style="width:28px;height:28px;border-radius:50%;background:'+day.color+';border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.18)">'+(emojis[l.type]||'📌')+'</div>',iconSize:[28,28],iconAnchor:[14,14]});
    const m=L.marker([l.lat,l.lng],{icon:ic}).addTo(map);
    m.bindPopup('<b>'+l.name+'</b>'+(l.time?'<br>'+l.time:'')+'<br>'+l.desc+(l.budget?'<br><span style="color:#ff9500">'+l.budget+'</span>':'')+'<br><a href="'+amapNavUrl(l.lat,l.lng)+'" target="_blank">🧭 导航</a>');
    markers.push(m);
    if(l.time!=='—')coords.push([l.lat,l.lng]);
  });
  if(coords.length>1){const pl=L.polyline(coords,{color:day.color,weight:2.5,opacity:.5,dashArray:'6,5'}).addTo(map);polylines.push(pl);}
  if(coords.length)map.fitBounds(coords,{padding:[40,40],maxZoom:12});
}
function locCard(loc,dayIdx){
  const uid='d'+dayIdx+'-'+loc.name.replace(/\W/g,'');
  let lnk='<a href="'+amapNavUrl(loc.lat,loc.lng)+'" target="_blank" class="btn nav">🧭 导航</a>';
  return '<div class="tl-item"><div class="tl-dot"></div><div class="card"><div class="time">'+(loc.time==='—'?'备选':(loc.time||''))+'</div><div class="name">'+loc.name+'</div><div class="desc">'+loc.desc+'</div>'+(loc.budget?'<div class="budget">预算 '+loc.budget+'</div>':'')+'<div class="links">'+lnk+'</div></div></div>';
}
function renderDay(idx){
  const d=DAYS.find(x=>x.id===idx);if(!d)return'';
  const main=d.locations.filter(l=>l.time!=='—');
  const alt=d.locations.filter(l=>l.time==='—');
  let h='<div class="day-head"><h2>'+d.title+'</h2><p>'+d.date+'</p></div>';
  if(main.length){h+='<div class="section-head">行程</div><div class="timeline">';main.forEach(l=>h+=locCard(l,idx));h+='</div>';}
  if(alt.length){h+='<div class="section-head">备选（二选一）</div><div class="timeline">';alt.forEach(l=>h+=locCard(l,idx));h+='</div>';}
  return h;
}
const tabsEl=document.getElementById('tabs');
const contentEl=document.getElementById('content');
DAYS.forEach(d=>{const btn=document.createElement('button');btn.className='tab'+(d.id===0?' active':'');btn.dataset.day=d.id;btn.textContent=d.label;tabsEl.appendChild(btn);});
function go(idx){contentEl.innerHTML=idx===0?overviewContent():renderDay(idx);showDay(idx);contentEl.scrollTo({top:0});const tab=tabsEl.querySelector('[data-day="'+idx+'"]');if(tab)tab.scrollIntoView({behavior:'smooth',inline:'center'});}
tabsEl.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)go(+t.dataset.day);});
function overviewContent(){
  const dayListHtml=DAYS.slice(1).map(d=>'<div class="card" onclick="go('+d.id+')"><div class="name"><span class="dot" style="background:'+d.color+'"></span>'+d.label+' · '+d.title+'</div><div class="desc">'+d.date+'</div></div>').join('');
  return '<div class="hero"><h1>追 秋 · 大 兴 安 岭</h1><p>9.26 — 10.5 · 台州出发 · 十日自驾</p></div>'+
  '<div class="info-grid"><div class="info-card"><div class="lab">出发</div><div class="val">台州</div></div><div class="info-card"><div class="lab">回程</div><div class="val">台州</div></div><div class="info-card"><div class="lab">交通</div><div class="val">航班+自驾</div></div><div class="info-card"><div class="lab">天数</div><div class="val">10天9晚</div></div></div>'+
  '<div class="section-head">每日行程</div><div>'+dayListHtml+'</div>'+
  '<div class="section-head">实用贴士</div><div class="pay-summary"><div>• 加油：满归加油站加满油</div><div>• 预约：莫尔格勒河、阿尔山需提前预约</div><div>• 导航：高德+百度地图双备</div><div>• 穿衣：昼夜温差10+℃</div></div>';
}
go(0);
</script>
</body>
</html>
